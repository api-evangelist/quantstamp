name: Quantstamp
description: 'Quantstamp is a blockchain security firm founded in 2017 that provides expert Web3
  security assessments, including smart contract audits, infrastructure and Layer 2 audits, zero-knowledge
  circuit reviews, and economic exploit analysis. The company has conducted over 1,300 audits across more
  than 60 blockchain ecosystems and helped secure billions of dollars in digital assets. Quantstamp
  publishes public audit reports through its certificate portal, maintains open-source Web3 security
  tooling on GitHub (L2 block explorer standards, ERC-4337 checkers, halo2 zero-knowledge libraries),
  and runs a research blog. Quantstamp is a services and consulting provider rather than an API-first
  platform, and does not currently publish a first-party developer API or OpenAPI specification. Backed
  by SoftBank Vision Fund.'
